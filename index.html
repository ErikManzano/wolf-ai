<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta property="og:title" content="Homilos Builder" />
    <meta property="og:description" content="Premium training OS for coaches — built for performance." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        const stored = localStorage.getItem('wolf_theme_v2');
        const theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#111111' : '#FFFFFF';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Homilos Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Último recurso: URL absoluta del API (https, sin / final). En Netlify mejor usa VITE_API_URL=/api + NETLIFY_API_PROXY_TARGET.
      <script>window.__WOLF_API_URL__ = 'https://tu-api.up.railway.app';</script>
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
